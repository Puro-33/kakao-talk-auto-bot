name: Conversation storage tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conversation-storage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sqlite-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x gradlew
      - name: Verify isolated conversation storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.example.kakaotalkautobot.ConversationStoreInstrumentedTest,com.example.kakaotalkautobot.RoomTargetAdapterInstrumentedTest,com.example.kakaotalkautobot.ExampleInstrumentedTest#testModelIdentityUsesConfiguredMetadata --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-storage-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
      - name: Upload device test APKs
        uses: actions/upload-artifact@v4
        with:
          name: device-test-apks
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
