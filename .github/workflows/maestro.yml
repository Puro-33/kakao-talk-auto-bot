name: Maestro UI Test

on:
  workflow_dispatch:

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Build APK and prepare UI suite
        run: |
          maestro --version
          ./gradlew assembleDebug --no-daemon --max-workers=2 --console=plain
          mkdir -p .maestro-smoke .maestro-results .maestro-debug .maestro-artifacts
          cp .maestro/conversations.yaml .maestro/home.yaml .maestro/settings.yaml .maestro/room-management.yaml .maestro-smoke/

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            bash -c 'maestro test .maestro-smoke --format junit --output "$PWD/.maestro-results/junit.xml" --debug-output "$PWD/.maestro-debug" --test-output-dir "$PWD/.maestro-artifacts" --flatten-debug-output; test_status=$?; adb logcat -d > .maestro-results/logcat.txt; exit "$test_status"'

      - name: Upload Maestro artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-results
          path: |
            .maestro-results/**
            .maestro-debug/**
            .maestro-artifacts/**
